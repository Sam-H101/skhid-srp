[package]
name = "skhid-launcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[[bin]]
name = "skhid-launcher"
path = "src/main.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:wry", "dep:tao", "dep:base64", "dep:open"]

[dependencies]
updater_logic = { package = "skhid-updater-logic", path = "../updater/logic" }
ureq = { version = "=3.1.4", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wry = { version = "=0.57.0", optional = true }
tao = { version = "=0.34.8", optional = true }
base64 = { version = "0.22", optional = true }
open = { version = "5", optional = true }

[profile.release]
lto = "thin"
strip = true
